name: rakit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rakit.yml'
      - 'alat/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rakit
  cancel-in-progress: true
env:
  BASE_REPO: EnVyxS/lux-modul-trading
  BASE_REF: 8401b2327736a4cc5c588d211eb6911dde0842da
  FIX_REPO: EnVyxS/uji-trading
  FIX_REF: c1749202dc31be1f995485dfc5c549c077338ecf
  GIT_TERMINAL_PROMPT: '0'
  SUMBER_BASE: /tmp/sumber_base
  SUMBER_FIX: /tmp/sumber_fix
jobs:
  bedah:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: klon sumber ke luar worktree
        run: bash alat/klon.sh
      - name: bedah beda
        continue-on-error: true
        run: |
          set +e
          python3 alat/bedah_gabung.py 2>&1 | tee bukti/jejak_bedah.txt
          echo "rc=${PIPESTATUS[0]}" | tee -a bukti/jejak_bedah.txt

      - name: rakit isi repo
        run: bash alat/rakit.sh

      - name: dependensi
        continue-on-error: true
        run: |
          set +e
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt 2>&1 | tee bukti/jejak_dependensi.txt
          echo "rc=${PIPESTATUS[0]}" | tee -a bukti/jejak_dependensi.txt
          python -m pip freeze 2>&1 | tee bukti/pip_freeze.txt

      - name: periksa rakitan
        continue-on-error: true
        run: bash alat/periksa.sh

      - name: buang artefak yang tidak boleh ikut
        if: always()
        run: |
          git rm -r --cached --ignore-unmatch -q sumber_base sumber_fix .pytest_cache || true
          rm -rf sumber_base sumber_fix .pytest_cache || true

      - name: rekam hasil rakitan
        if: always()
        run: |
          git config user.name "rakit-bot"
          git config user.email "rakit-bot@users.noreply.github.com"
          git add -A
          git add -A -f bukti || true
          if [ -d dataset_masuk ]; then git add -A -f dataset_masuk || true; fi
          git commit -q -m "[rakit] modul terbaru + lapisan aman + bukti ${GITHUB_SHA} [skip ci]" || echo "tidak ada perubahan"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q && git push -q && break
            echo "push ulang percobaan $i"
            sleep 5
          done
