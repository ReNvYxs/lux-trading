name: tambal
on:
  push:
    branches: [main]
    paths:
      - 'alat/pasang_v2.py'
      - 'alat/pasang_env.py'
      - '.github/workflows/tambal.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tambal
env:
  GIT_TERMINAL_PROMPT: '0'
jobs:
  tambal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: detak awal
        run: |
          mkdir -p bukti/tambal
          echo "tambal=MULAI" > bukti/tambal/DETAK_TAMBAL.txt
          date -u +"mulai_utc=%Y-%m-%dT%H:%M:%SZ" >> bukti/tambal/DETAK_TAMBAL.txt
          echo "commit=$GITHUB_SHA" >> bukti/tambal/DETAK_TAMBAL.txt
          cat bukti/tambal/DETAK_TAMBAL.txt

      - name: tambal kode
        continue-on-error: true
        run: |
          mkdir -p bukti/tambal
          set +e
          python3 alat/pasang_v2.py 2>&1 | tee bukti/tambal/jejak_tambal.txt
          echo "rc=${PIPESTATUS[0]}" | tee -a bukti/tambal/jejak_tambal.txt

      - name: tambal env contoh
        continue-on-error: true
        run: |
          mkdir -p bukti/tambal
          set +e
          python3 alat/pasang_env.py 2>&1 | tee bukti/tambal/jejak_env.txt
          echo "rc=${PIPESTATUS[0]}" | tee -a bukti/tambal/jejak_env.txt

      - name: kompilasi ulang seluruh pohon
        continue-on-error: true
        run: |
          mkdir -p bukti/tambal
          set +e
          python3 -m compileall -q lux_modul alat scripts tests 2>&1 | tee bukti/tambal/jejak_kompilasi.txt
          echo "rc=${PIPESTATUS[0]}" | tee -a bukti/tambal/jejak_kompilasi.txt

      - name: rekam bukti
        if: always()
        run: |
          rm -rf .pytest_cache || true
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + || true
          git config user.name "tambal-bot"
          git config user.email "tambal-bot@users.noreply.github.com"
          git add -A -f bukti lux_modul alat .env.contoh || true
          git commit -q -m "[tambal] saklar otomatis, pemulihan, koreksi dokumen $GITHUB_SHA [skip ci]" || echo "tidak ada perubahan"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q && git push -q && break
            echo "push ulang percobaan $i"
            sleep 5
          done

      - name: vonis
        if: always()
        run: |
          KODE=0
          grep -q "^rc=0$" bukti/tambal/jejak_tambal.txt || KODE=1
          grep -q "^rc=0$" bukti/tambal/jejak_env.txt || KODE=1
          grep -q "^rc=0$" bukti/tambal/jejak_kompilasi.txt || KODE=1
          exit $KODE
